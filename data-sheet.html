<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Spreadsheet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header { margin-bottom: 24px; }
    header h1 { font-size: 1.5rem; font-weight: 700; color: #1a56db; }
    header p { font-size: 0.8rem; color: #6b7280; margin-top: 4px; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar input {
      padding: 7px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.875rem;
      width: 220px;
      outline: none;
    }
    .toolbar input:focus { border-color: #1a56db; }

    .badge {
      background: #dbeafe; color: #1d4ed8;
      font-size: 0.75rem; font-weight: 600;
      padding: 2px 8px; border-radius: 99px;
    }
    .cache-tag {
      background: #d1fae5; color: #065f46;
      font-size: 0.7rem; font-weight: 600;
      padding: 2px 7px; border-radius: 99px;
    }

    .btn {
      padding: 7px 13px;
      background: #1a56db; color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.8rem; cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #1648c0; }

    .btn-outline {
      padding: 7px 13px;
      background: #fff; color: #1a56db;
      border: 1px solid #1a56db; border-radius: 8px;
      font-size: 0.8rem; cursor: pointer;
      white-space: nowrap;
    }
    .btn-outline:hover { background: #eff6ff; }

    /* Column filter panel */
    .col-panel {
      display: none;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 16px;
      background: #f8fafc;
    }
    .col-panel.open { display: block; }
    .col-panel-title {
      font-size: 0.8rem; font-weight: 600; color: #374151;
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .col-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .col-chip {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      border: 1.5px solid #d1d5db;
      border-radius: 99px;
      font-size: 0.78rem;
      cursor: pointer;
      background: #fff;
      transition: all 0.15s;
      user-select: none;
    }
    .col-chip.active {
      background: #1a56db;
      border-color: #1a56db;
      color: #fff;
    }
    .col-chip input[type=checkbox] { display: none; }
    .col-actions { display: flex; gap: 6px; margin-top: 12px; }
    .col-actions button {
      font-size: 0.75rem; padding: 4px 10px;
      border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; cursor: pointer; color: #374151;
    }
    .col-actions button:hover { background: #f3f4f6; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      table-layout: auto;
    }

    thead tr { background: #1a56db; color: #fff; }
    thead th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { background: #1648c0; }

    .virtual-body-wrap {
      overflow-y: auto;
      max-height: 520px;
      position: relative;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
    }

    tbody tr { border-bottom: 1px solid #f3f4f6; }
    tbody tr:hover { background: #eff6ff; }
    td { padding: 9px 14px; white-space: nowrap; }

    .status {
      padding: 40px;
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
    }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid #d1d5db;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #dc2626; }

    .action-cell {
      padding: 6px 10px;
      white-space: nowrap;
      text-align: center;
    }
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border: none;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      text-decoration: none;
      line-height: 1;
    }
    .copy-btn:hover { opacity: 0.85; transform: scale(1.05); }
    .copy-btn:active { transform: scale(0.97); }
    .btn-wa  { background: #25d366; color: #fff; }
    .copy-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

    .toast {
      position: fixed;
      bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1a202c; color: #fff;
      padding: 8px 18px; border-radius: 8px;
      font-size: 0.8rem; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    thead th.th-action {
      text-align: center;
      cursor: default;
      pointer-events: none;
    }
    thead th.th-action:hover { background: #1a56db; }
  </style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="container">
  <header>
    <h1>📊 Data Spreadsheet</h1>
    <p>Data dari Google Sheets — cache lokal aktif untuk loading cepat</p>
  </header>

  <div class="card">
    <!-- Toolbar -->
    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍 Cari data..." />
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn-outline" onclick="toggleColPanel()" id="btn-col">⚙ Kolom <span id="col-count"></span></button>
        <span id="row-count"></span>
        <span id="cache-indicator"></span>
        <button class="btn" onclick="loadData(true)">↻ Refresh</button>
      </div>
    </div>

    <!-- Column visibility panel -->
    <div class="col-panel" id="col-panel">
      <div class="col-panel-title">
        <span>Pilih kolom yang ditampilkan</span>
      </div>
      <div class="col-grid" id="col-grid"></div>
      <div class="col-actions">
        <button onclick="setAllCols(true)">✓ Semua</button>
        <button onclick="setAllCols(false)">✗ Semua</button>
        <button onclick="toggleColPanel()">Tutup</button>
      </div>
    </div>

    <div id="status" class="status"><span class="spinner"></span> Memuat data...</div>

    <div class="table-wrap" id="table-wrap" style="display:none">
      <div class="virtual-body-wrap" id="vscroll">
        <table style="width:100%;border-collapse:collapse;font-size:0.875rem;table-layout:auto">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQu7Wi7OioirnX3XOEIieyF8nwMaIUu0q-Xbj3C7CGO8waSH5oS01XHSdT_1j29aTtVG9y7aingjGTB/pub?gid=0&single=true&output=csv";
  const CACHE_KEY  = "gsheet_cache";
  const CACHE_TTL  = 5 * 60 * 1000;
  const ROW_HEIGHT = 38;
  const VISIBLE_BUFFER = 10;

  let allRows = [], filteredRows = [], headers = [];
  let visibleCols = [];   // boolean[] — kolom mana yg tampil
  let sortCol = -1, sortAsc = true;
  let debounceTimer = null;
  let lastStart = -1;

  // ── CSV Parser ───────────────────────────────────────────────
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (inQ && text[i+1] === '"') { cell += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        row.push(cell.trim()); cell = '';
      } else if ((ch === '\n' || ch === '\r') && !inQ) {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(cell.trim()); cell = '';
        if (row.some(c => c !== '')) rows.push(row);
        row = [];
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell.trim()); if (row.some(c=>c!=='')) rows.push(row); }
    return rows;
  }

  // ── Cache ────────────────────────────────────────────────────
  function saveCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
  }
  function loadCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (c && Date.now() - c.ts < CACHE_TTL) return c;
    } catch(e) {}
    return null;
  }

  // ── Column panel ─────────────────────────────────────────────
  function toggleColPanel() {
    document.getElementById('col-panel').classList.toggle('open');
  }

  function buildColPanel() {
    const grid = document.getElementById('col-grid');
    grid.innerHTML = '';
    headers.forEach((h, i) => {
      const chip = document.createElement('label');
      chip.className = 'col-chip' + (visibleCols[i] ? ' active' : '');
      chip.innerHTML = `<input type="checkbox" ${visibleCols[i]?'checked':''} />${escHtml(h)}`;
      chip.querySelector('input').addEventListener('change', e => {
        visibleCols[i] = e.target.checked;
        chip.classList.toggle('active', visibleCols[i]);
        updateColCount();
        renderHeader();
        lastStart = -1;
        renderVisible();
      });
      grid.appendChild(chip);
    });
    updateColCount();
  }

  function setAllCols(val) {
    visibleCols = headers.map(() => val);
    buildColPanel();
    renderHeader();
    lastStart = -1;
    renderVisible();
  }

  function updateColCount() {
    const on = visibleCols.filter(Boolean).length;
    document.getElementById('col-count').textContent = `(${on}/${headers.length})`;
  }

  // active column indices
  function activeCols() {
    return headers.map((_, i) => i).filter(i => visibleCols[i]);
  }

  // ── Render header ────────────────────────────────────────────
  function renderHeader() {
    const thead = document.getElementById('thead');
    thead.innerHTML = '';
    const tr = document.createElement('tr');
    // action column header
    const thAct = document.createElement('th');
    thAct.className = 'th-action';
    thAct.textContent = 'Kirim';
    tr.appendChild(thAct);
    activeCols().forEach(i => {
      const th = document.createElement('th');
      const icon = sortCol === i ? (sortAsc ? ' ▲' : ' ▼') : ' ⇅';
      th.innerHTML = escHtml(headers[i]) + `<span style="opacity:.6;font-size:.75em">${icon}</span>`;
      th.onclick = () => sortBy(i);
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  // ── SVG icons ────────────────────────────────────────────────
  const SVG_WA = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.852L.057 23.885a.5.5 0 0 0 .606.606l6.148-1.53A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.885 0-3.652-.518-5.166-1.418l-.371-.22-3.849.959.975-3.764-.242-.389A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>`;


  // ── Format baris jadi teks ────────────────────────────────────
  function rowToText(row) {
    const cols = activeCols();
    const values = cols.map(j => row[j] ?? '').filter(v => v !== '');
    return '■ ' + values.join(' | ') + ' |';
  }

  // ── Toast ─────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ── Copy handlers ─────────────────────────────────────────────
  function copyForWA(rowIdx) {
    const text = rowToText(filteredRows[rowIdx]);
    navigator.clipboard.writeText(text).then(() => showToast('✅ Disalin untuk WhatsApp!'));
  }

  // ── Virtual scroll ───────────────────────────────────────────
  function renderVisible() {
    const vscroll = document.getElementById('vscroll');
    const tbody   = document.getElementById('tbody');
    const scrollTop = vscroll.scrollTop;
    const viewH   = vscroll.clientHeight;
    const cols    = activeCols();
    const totalCols = cols.length + 1; // +1 for action col

    const start = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - VISIBLE_BUFFER);
    const end   = Math.min(filteredRows.length, Math.ceil((scrollTop + viewH) / ROW_HEIGHT) + VISIBLE_BUFFER);

    if (start === lastStart) return;
    lastStart = start;

    const topH = start * ROW_HEIGHT;
    const botH = (filteredRows.length - end) * ROW_HEIGHT;

    let html = `<tr><td colspan="${totalCols}" style="height:${topH}px;padding:0;border:none"></td></tr>`;
    for (let i = start; i < end; i++) {
      const absIdx = i;
      html += `<tr>
        <td class="action-cell">
          <button class="copy-btn btn-wa" onclick="copyForWA(${absIdx})" title="Copy untuk WhatsApp">${SVG_WA} WA</button>
        </td>`;
      cols.forEach(j => { html += `<td>${escHtml(filteredRows[i][j] ?? '')}</td>`; });
      html += '</tr>';
    }
    html += `<tr><td colspan="${totalCols}" style="height:${botH}px;padding:0;border:none"></td></tr>`;
    tbody.innerHTML = html;
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Filter + sort ────────────────────────────────────────────
  function applyFilter() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    filteredRows = q
      ? allRows.filter(r => r.some(c => c.toLowerCase().includes(q)))
      : allRows.slice();
    if (sortCol >= 0) {
      filteredRows.sort((a, b) => {
        const va = a[sortCol]??'', vb = b[sortCol]??'';
        const na = parseFloat(va.replace(/[^0-9.-]/g,'')), nb = parseFloat(vb.replace(/[^0-9.-]/g,''));
        const cmp = (!isNaN(na)&&!isNaN(nb)) ? na-nb : va.localeCompare(vb,'id');
        return sortAsc ? cmp : -cmp;
      });
    }
    lastStart = -1;
    document.getElementById('vscroll').scrollTop = 0;
    renderVisible();
    document.getElementById('row-count').innerHTML = `<span class="badge">${filteredRows.length} baris</span>`;
  }

  function sortBy(col) {
    sortAsc = sortCol === col ? !sortAsc : true;
    sortCol = col;
    renderHeader();
    applyFilter();
  }

  document.getElementById('search').addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(applyFilter, 200);
  });

  // ── Load data ────────────────────────────────────────────────
  async function loadData(forceRefresh = false) {
    const status   = document.getElementById('status');
    const wrap     = document.getElementById('table-wrap');
    const cacheInd = document.getElementById('cache-indicator');

    if (!forceRefresh) {
      const cached = loadCache();
      if (cached) {
        headers     = cached.data.headers;
        allRows     = cached.data.rows;
        visibleCols = headers.map(() => true);
        const age = Math.round((Date.now() - cached.ts) / 1000);
        cacheInd.innerHTML = `<span class="cache-tag">⚡ Cache ${age}d lalu</span>`;
        status.style.display = 'none';
        wrap.style.display = 'block';
        renderHeader();
        buildColPanel();
        applyFilter();
        setupScroll();
        return;
      }
    }

    status.innerHTML = '<span class="spinner"></span> Memuat data...';
    status.style.display = 'block';
    wrap.style.display = 'none';
    cacheInd.innerHTML = '';

    try {
      const res = await fetch(CSV_URL + '&t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 1) throw new Error('Data kosong');

      headers     = rows[0];
      allRows     = rows.slice(1);
      visibleCols = headers.map(() => true);
      saveCache({ headers, rows: allRows });
      cacheInd.innerHTML = `<span class="cache-tag">✓ Data baru</span>`;

      status.style.display = 'none';
      wrap.style.display = 'block';
      renderHeader();
      buildColPanel();
      applyFilter();
      setupScroll();
    } catch(err) {
      status.innerHTML = `<span class="error">❌ Gagal: ${err.message}</span><br><br><button class="btn" onclick="loadData(true)">Coba Lagi</button>`;
    }
  }

  function setupScroll() {
    const vscroll = document.getElementById('vscroll');
    vscroll.removeEventListener('scroll', renderVisible);
    vscroll.addEventListener('scroll', renderVisible, { passive: true });
    vscroll.querySelector('tbody').style.minHeight = (filteredRows.length * ROW_HEIGHT) + 'px';
  }

  loadData();
</script>
</body>
</html>
