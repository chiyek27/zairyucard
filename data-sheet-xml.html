<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Spreadsheet (XML)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header { margin-bottom: 24px; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #0e7490; }
    header p { font-size: 0.875rem; color: #6b7280; margin-top: 4px; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
      gap: 10px;
    }

    .toolbar input {
      padding: 7px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.875rem;
      width: 240px;
      outline: none;
      transition: border 0.2s;
    }
    .toolbar input:focus { border-color: #0e7490; }

    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }

    thead tr { background: #0e7490; color: #fff; }
    thead th {
      padding: 11px 16px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { background: #0c6476; }

    tbody tr { border-bottom: 1px solid #f3f4f6; transition: background 0.1s; }
    tbody tr:hover { background: #ecfeff; }
    tbody tr:last-child { border-bottom: none; }
    td { padding: 10px 16px; white-space: nowrap; }

    .status { padding: 32px; text-align: center; color: #6b7280; font-size: 0.9rem; }

    .spinner {
      display: inline-block;
      width: 22px; height: 22px;
      border: 3px solid #d1d5db;
      border-top-color: #0e7490;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #dc2626; }

    .badge {
      display: inline-block;
      background: #cffafe;
      color: #0e7490;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .btn-refresh {
      padding: 7px 14px;
      background: #0e7490;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-refresh:hover { background: #0c6476; }

    .xml-note {
      font-size: 0.75rem;
      color: #9ca3af;
      padding: 8px 20px;
      border-top: 1px solid #f3f4f6;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📄 Data Spreadsheet</h1>
      <p>Sumber data: Google Sheets via XML — otomatis diperbarui setiap halaman dibuka</p>
    </header>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="search" placeholder="🔍 Cari data..." oninput="filterTable()" />
        <div style="display:flex;align-items:center;gap:12px">
          <span id="row-count"></span>
          <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
        </div>
      </div>

      <div class="table-wrap">
        <div class="status" id="status">
          <span class="spinner"></span> Memuat data XML...
        </div>
        <table id="tabel" style="display:none">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>

      <div class="xml-note" id="xml-note" style="display:none">
        📦 Format sumber: XML (Google Sheets Atom Feed)
      </div>
    </div>
  </div>

  <script>
    // Ganti URL di bawah jika ingin pakai sheet lain
    const XML_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQu7Wi7OioirnX3XOEIieyF8nwMaIUu0q-Xbj3C7CGO8waSH5oS01XHSdT_1j29aTtVG9y7aingjGTB/pub?gid=0&single=true&output=xml";

    let allRows = [];
    let headers = [];
    let sortCol = -1;
    let sortAsc = true;

    function parseXML(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, "application/xml");

      // Cek error parsing
      const parserError = doc.querySelector("parsererror");
      if (parserError) throw new Error("XML tidak valid: " + parserError.textContent.slice(0, 100));

      // Google Sheets XML pakai namespace "ss"
      // Struktur: <Workbook> > <Worksheet> > <Table> > <Row> > <Cell> > <Data>
      const NS = "urn:schemas-microsoft-com:office:spreadsheet";

      const rows = doc.getElementsByTagNameNS(NS, "Row");
      if (rows.length === 0) {
        // Fallback: coba tanpa namespace (beberapa versi Google export berbeda)
        return parseFallback(doc);
      }

      const result = [];
      for (const row of rows) {
        const cells = row.getElementsByTagNameNS(NS, "Cell");
        const rowData = [];
        let prevIndex = 0;

        for (const cell of cells) {
          // Handle ss:Index untuk sel yang di-skip (kosong)
          const idx = cell.getAttributeNS(NS, "Index");
          if (idx) {
            const skipTo = parseInt(idx) - 1;
            while (rowData.length < skipTo) rowData.push("");
          }
          const data = cell.getElementsByTagNameNS(NS, "Data")[0];
          rowData.push(data ? data.textContent.trim() : "");
        }
        result.push(rowData);
      }
      return result;
    }

    function parseFallback(doc) {
      // Fallback: coba baca sebagai Atom feed (format lama Google Sheets XML)
      const entries = doc.querySelectorAll("entry");
      if (entries.length === 0) throw new Error("Format XML tidak dikenali. Pastikan sheet sudah dipublish.");

      // Atom feed: tiap entry = 1 sel, dengan title berisi koordinat (A1, B1, dst)
      const cellMap = {};
      let maxRow = 0, maxCol = 0;

      for (const entry of entries) {
        const title = entry.querySelector("title")?.textContent ?? "";
        const content = entry.querySelector("content")?.textContent ?? "";
        const match = title.match(/^([A-Z]+)(\d+)$/);
        if (!match) continue;

        const col = colLetterToIndex(match[1]);
        const row = parseInt(match[2]);
        cellMap[`${row},${col}`] = content.trim();
        if (row > maxRow) maxRow = row;
        if (col > maxCol) maxCol = col;
      }

      const result = [];
      for (let r = 1; r <= maxRow; r++) {
        const row = [];
        for (let c = 1; c <= maxCol; c++) {
          row.push(cellMap[`${r},${c}`] ?? "");
        }
        result.push(row);
      }
      return result;
    }

    function colLetterToIndex(letters) {
      let n = 0;
      for (const ch of letters) n = n * 26 + ch.charCodeAt(0) - 64;
      return n;
    }

    function renderTable(rows) {
      const thead = document.getElementById('thead');
      const tbody = document.getElementById('tbody');
      thead.innerHTML = '';
      tbody.innerHTML = '';

      const tr = document.createElement('tr');
      headers.forEach((h, i) => {
        const th = document.createElement('th');
        const icon = sortCol === i ? (sortAsc ? ' ▲' : ' ▼') : ' ⇅';
        th.innerHTML = `${h}<span style="opacity:.6;font-size:.8em">${icon}</span>`;
        th.onclick = () => sortTable(i);
        tr.appendChild(th);
      });
      thead.appendChild(tr);

      rows.forEach(row => {
        const tr = document.createElement('tr');
        headers.forEach((_, i) => {
          const td = document.createElement('td');
          td.textContent = row[i] ?? '';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      document.getElementById('row-count').innerHTML = `<span class="badge">${rows.length} baris</span>`;
    }

    function filterTable() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = q
        ? allRows.filter(r => r.some(c => c.toLowerCase().includes(q)))
        : allRows;
      renderTable(filtered);
    }

    function sortTable(col) {
      if (sortCol === col) sortAsc = !sortAsc;
      else { sortCol = col; sortAsc = true; }
      allRows.sort((a, b) => {
        const va = a[col] ?? '', vb = b[col] ?? '';
        const na = parseFloat(va.replace(/[^0-9.-]/g, '')), nb = parseFloat(vb.replace(/[^0-9.-]/g, ''));
        const cmp = (!isNaN(na) && !isNaN(nb)) ? na - nb : va.localeCompare(vb, 'id');
        return sortAsc ? cmp : -cmp;
      });
      filterTable();
    }

    async function loadData() {
      const status = document.getElementById('status');
      const tabel = document.getElementById('tabel');
      const note = document.getElementById('xml-note');
      status.innerHTML = '<span class="spinner"></span> Memuat data XML...';
      status.style.display = 'block';
      tabel.style.display = 'none';
      note.style.display = 'none';

      try {
        const res = await fetch(XML_URL + '&t=' + Date.now());
        if (!res.ok) throw new Error('Gagal mengambil data (HTTP ' + res.status + ')');
        const text = await res.text();

        const rows = parseXML(text);
        if (rows.length < 1) throw new Error('Data kosong');

        // Normalisasi lebar kolom (isi baris yang lebih pendek)
        const maxCols = Math.max(...rows.map(r => r.length));
        rows.forEach(r => { while (r.length < maxCols) r.push(""); });

        headers = rows[0];
        allRows = rows.slice(1).filter(r => r.some(c => c !== ''));

        status.style.display = 'none';
        tabel.style.display = 'table';
        note.style.display = 'block';
        filterTable();
      } catch (err) {
        status.innerHTML = `<span class="error">❌ Error: ${err.message}</span><br><br>
          <small style="color:#6b7280">Pastikan sheet sudah dipublish via File → Bagikan → Publikasikan ke web</small><br><br>
          <button class="btn-refresh" onclick="loadData()">Coba Lagi</button>`;
      }
    }

    loadData();
  </script>
</body>
</html>
