<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Spreadsheet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container { max-width: 1100px; margin: 0 auto; }

    header { margin-bottom: 24px; }
    header h1 { font-size: 1.5rem; font-weight: 700; color: #1a56db; }
    header p { font-size: 0.8rem; color: #6b7280; margin-top: 4px; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toolbar input {
      padding: 7px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.875rem;
      width: 240px;
      outline: none;
    }
    .toolbar input:focus { border-color: #1a56db; }

    .badge {
      background: #dbeafe; color: #1d4ed8;
      font-size: 0.75rem; font-weight: 600;
      padding: 2px 8px; border-radius: 99px;
    }

    .cache-tag {
      background: #d1fae5; color: #065f46;
      font-size: 0.7rem; font-weight: 600;
      padding: 2px 7px; border-radius: 99px;
    }

    .btn {
      padding: 7px 13px;
      background: #1a56db; color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.8rem; cursor: pointer;
    }
    .btn:hover { background: #1648c0; }

    /* Virtual scroll container */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      table-layout: auto;
    }

    thead tr { background: #1a56db; color: #fff; }
    thead th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { background: #1648c0; }

    /* Virtual rows wrapper */
    .virtual-body-wrap {
      overflow-y: auto;
      max-height: 520px;
      position: relative;
    }

    .spacer-top, .spacer-bottom { background: transparent; }

    tbody tr {
      border-bottom: 1px solid #f3f4f6;
    }
    tbody tr:hover { background: #eff6ff; }
    td { padding: 9px 14px; white-space: nowrap; }

    .status {
      padding: 40px;
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid #d1d5db;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #dc2626; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>📊 Data Spreadsheet</h1>
    <p>Data dari Google Sheets — cache lokal aktif untuk loading cepat</p>
  </header>

  <div class="card">
    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍 Cari data..." />
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span id="row-count"></span>
        <span id="cache-indicator"></span>
        <button class="btn" onclick="loadData(true)">↻ Refresh</button>
      </div>
    </div>

    <div id="status" class="status"><span class="spinner"></span> Memuat data...</div>

    <div class="table-wrap" id="table-wrap" style="display:none">
      <table>
        <thead id="thead"></thead>
      </table>
      <div class="virtual-body-wrap" id="vscroll">
        <table style="width:100%;border-collapse:collapse;font-size:0.875rem;table-layout:auto">
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQu7Wi7OioirnX3XOEIieyF8nwMaIUu0q-Xbj3C7CGO8waSH5oS01XHSdT_1j29aTtVG9y7aingjGTB/pub?gid=0&single=true&output=csv";
  const CACHE_KEY = "gsheet_cache";
  const CACHE_TTL = 5 * 60 * 1000; // 5 menit

  const ROW_HEIGHT = 38;
  const VISIBLE_BUFFER = 10;

  let allRows = [];
  let filteredRows = [];
  let headers = [];
  let sortCol = -1, sortAsc = true;
  let debounceTimer = null;

  // ── CSV Parser ──────────────────────────────────────────────
  function parseCSV(text) {
    const rows = [];
    let row = [], cell = '', inQ = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === '"') {
        if (inQ && text[i+1] === '"') { cell += '"'; i++; }
        else inQ = !inQ;
      } else if (ch === ',' && !inQ) {
        row.push(cell.trim()); cell = '';
      } else if ((ch === '\n' || ch === '\r') && !inQ) {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(cell.trim()); cell = '';
        if (row.some(c => c !== '')) rows.push(row);
        row = [];
      } else cell += ch;
    }
    if (cell || row.length) { row.push(cell.trim()); if (row.some(c=>c!=='')) rows.push(row); }
    return rows;
  }

  // ── Cache ────────────────────────────────────────────────────
  function saveCache(data) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch(e) {}
  }
  function loadCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY));
      if (c && Date.now() - c.ts < CACHE_TTL) return c;
    } catch(e) {}
    return null;
  }

  // ── Render header ────────────────────────────────────────────
  function renderHeader() {
    const thead = document.getElementById('thead');
    thead.innerHTML = '';
    const tr = document.createElement('tr');
    headers.forEach((h, i) => {
      const th = document.createElement('th');
      const icon = sortCol === i ? (sortAsc ? ' ▲' : ' ▼') : ' ⇅';
      th.innerHTML = h + `<span style="opacity:.6;font-size:.75em">${icon}</span>`;
      th.onclick = () => { sortBy(i); };
      tr.appendChild(th);
    });
    thead.appendChild(tr);
  }

  // ── Virtual scroll renderer ──────────────────────────────────
  let lastStart = -1;
  function renderVisible() {
    const vscroll = document.getElementById('vscroll');
    const tbody = document.getElementById('tbody');
    const scrollTop = vscroll.scrollTop;
    const viewH = vscroll.clientHeight;

    const start = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - VISIBLE_BUFFER);
    const end = Math.min(filteredRows.length, Math.ceil((scrollTop + viewH) / ROW_HEIGHT) + VISIBLE_BUFFER);

    if (start === lastStart) return;
    lastStart = start;

    const topH = start * ROW_HEIGHT;
    const botH = (filteredRows.length - end) * ROW_HEIGHT;

    let html = `<tr class="spacer-top"><td colspan="${headers.length}" style="height:${topH}px;padding:0;border:none"></td></tr>`;
    for (let i = start; i < end; i++) {
      html += '<tr>';
      headers.forEach((_, j) => {
        html += `<td>${escHtml(filteredRows[i][j] ?? '')}</td>`;
      });
      html += '</tr>';
    }
    html += `<tr class="spacer-bottom"><td colspan="${headers.length}" style="height:${botH}px;padding:0;border:none"></td></tr>`;
    tbody.innerHTML = html;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Filter + sort ────────────────────────────────────────────
  function applyFilter() {
    const q = document.getElementById('search').value.toLowerCase().trim();
    filteredRows = q ? allRows.filter(r => r.some(c => c.toLowerCase().includes(q))) : allRows.slice();
    if (sortCol >= 0) {
      filteredRows.sort((a, b) => {
        const va = a[sortCol]??'', vb = b[sortCol]??'';
        const na = parseFloat(va.replace(/[^0-9.-]/g,'')), nb = parseFloat(vb.replace(/[^0-9.-]/g,''));
        const cmp = (!isNaN(na)&&!isNaN(nb)) ? na-nb : va.localeCompare(vb,'id');
        return sortAsc ? cmp : -cmp;
      });
    }
    lastStart = -1;
    document.getElementById('vscroll').scrollTop = 0;
    renderVisible();
    document.getElementById('row-count').innerHTML = `<span class="badge">${filteredRows.length} baris</span>`;
  }

  function sortBy(col) {
    sortAsc = sortCol === col ? !sortAsc : true;
    sortCol = col;
    renderHeader();
    applyFilter();
  }

  // ── Debounce search ──────────────────────────────────────────
  document.getElementById('search').addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(applyFilter, 200);
  });

  // ── Load data ────────────────────────────────────────────────
  async function loadData(forceRefresh = false) {
    const status = document.getElementById('status');
    const wrap = document.getElementById('table-wrap');
    const cacheInd = document.getElementById('cache-indicator');

    if (!forceRefresh) {
      const cached = loadCache();
      if (cached) {
        headers = cached.data.headers;
        allRows = cached.data.rows;
        const age = Math.round((Date.now() - cached.ts) / 1000);
        cacheInd.innerHTML = `<span class="cache-tag">⚡ Cache ${age}d lalu</span>`;
        status.style.display = 'none';
        wrap.style.display = 'block';
        renderHeader();
        applyFilter();
        setupScroll();
        return;
      }
    }

    status.innerHTML = '<span class="spinner"></span> Memuat data...';
    status.style.display = 'block';
    wrap.style.display = 'none';
    cacheInd.innerHTML = '';

    try {
      const res = await fetch(CSV_URL + '&t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const rows = parseCSV(text);
      if (rows.length < 1) throw new Error('Data kosong');

      headers = rows[0];
      allRows = rows.slice(1);
      saveCache({ headers, rows: allRows });
      cacheInd.innerHTML = `<span class="cache-tag">✓ Data baru</span>`;

      status.style.display = 'none';
      wrap.style.display = 'block';
      renderHeader();
      applyFilter();
      setupScroll();
    } catch(err) {
      status.innerHTML = `<span class="error">❌ Gagal: ${err.message}</span><br><br><button class="btn" onclick="loadData(true)">Coba Lagi</button>`;
    }
  }

  function setupScroll() {
    const vscroll = document.getElementById('vscroll');
    vscroll.removeEventListener('scroll', renderVisible);
    vscroll.addEventListener('scroll', renderVisible, { passive: true });
    // Set total height
    vscroll.querySelector('table').style.minHeight = (filteredRows.length * ROW_HEIGHT) + 'px';
  }

  loadData();
</script>
</body>
</html>
